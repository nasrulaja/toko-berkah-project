/* ===== 1. CSS SPLASH 3D (prefiks tb3-, dari paket splash 3D Toko Berkah) ===== */
.tb3-lock,.tb3-lock body{overflow:hidden}
.tb3-splash{
  --c0:#F9FDFF;--c1:#C3E9FE;--c2:#97D8FE;--c3:#67C8FF;--c4:#3FB8FF;
  position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(90% 70% at 50% 40%,var(--c0),var(--c1) 70%,var(--c2));
  clip-path:circle(150% at 50% 50%);animation:tb3-out .9s cubic-bezier(.7,0,.3,1) 4.3s forwards;
}
.tb3-splash.tb3-skip{animation:tb3-out .3s ease forwards}
.tb3-splash.tb3-done{display:none}
/* Sudah login: splash disembunyikan sejak paint pertama (dipasang skrip paling atas) */
.tb3-off .tb3-splash{display:none}
.tb3-splash *{box-sizing:border-box}
@keyframes tb3-out{to{clip-path:circle(0% at 50% 50%);visibility:hidden}}
.tb3-blob{position:absolute;border-radius:50%}
.tb3-blob.a{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(closest-side,var(--c3),transparent);opacity:.35;animation:tb3-d1 14s ease-in-out infinite}
.tb3-blob.b{width:46vmax;height:46vmax;right:-16vmax;top:12vh;background:radial-gradient(closest-side,var(--c2),transparent);opacity:.45;animation:tb3-d2 16s ease-in-out infinite}
.tb3-blob.c{width:44vmax;height:44vmax;left:20vw;bottom:-22vmax;background:radial-gradient(closest-side,var(--c4),transparent);opacity:.3;animation:tb3-d1 15s ease-in-out infinite reverse}
@keyframes tb3-d1{50%{transform:translate(14vmax,10vmax) scale(1.1)}}
@keyframes tb3-d2{50%{transform:translate(-12vmax,12vmax) scale(.9)}}
.tb3-scene{position:relative;width:min(86vw,760px);perspective:1400px;perspective-origin:50% 45%;--px:0;--py:0;
  animation:tb3-zoom .9s cubic-bezier(.6,0,.9,.5) 4.3s forwards}
@keyframes tb3-zoom{to{transform:scale(2.3)}}
.tb3-tilt{font-size:min(.86vw,7.6px);transform-style:preserve-3d;transform:rotateY(calc(var(--px)*14deg)) rotateX(calc(var(--py)*-10deg));transition:transform .3s ease-out}
.tb3-stage{transform-style:preserve-3d;animation:tb3-in 1.7s cubic-bezier(.2,.9,.3,1) both,tb3-swing 7s 1.8s ease-in-out infinite}
@keyframes tb3-in{from{transform:rotateY(-80deg) rotateX(35deg) scale(.7)}to{transform:rotateY(-16deg) rotateX(8deg)}}
@keyframes tb3-swing{0%,100%{transform:rotateY(-16deg) rotateX(8deg)}50%{transform:rotateY(16deg) rotateX(3deg)}}
.tb3-logo{position:relative;width:100%;aspect-ratio:2064/762;transform-style:preserve-3d;font-size:min(.86vw,7.6px)}
.tb3-part{position:absolute;transform-style:preserve-3d}
.tb3-part i{
  position:absolute;inset:0;background:var(--cc);
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  transform:translateZ(calc((var(--k) - 11)*var(--zs,.55em)));
}
.tb3-basket{transform-origin:50% 100%;animation:tb3-rise 1s cubic-bezier(.2,1.2,.4,1) var(--d) both}
.tb3-leaf{transform-origin:92% 100%;animation:tb3-spin 1.1s cubic-bezier(.25,1.3,.4,1) var(--d) both,tb3-sway 4s 2.6s ease-in-out infinite}
.tb3-pestle{transform-origin:9% 92%;animation:tb3-fall 1.1s cubic-bezier(.3,1.3,.5,1) var(--d) both,tb3-grind 3.2s 2.8s ease-in-out infinite}
.tb3-l{animation:tb3-flip .9s cubic-bezier(.3,1.5,.5,1) var(--d) both,tb3-wave 3s calc(1.9s + var(--d)*.6) ease-in-out infinite}
@keyframes tb3-rise{from{transform:translate3d(0,40%,-300px) rotateX(75deg) scale(.001)}to{transform:none}}
@keyframes tb3-spin{from{transform:rotateY(-540deg) scale(.001)}to{transform:none}}
@keyframes tb3-fall{from{transform:translate3d(20%,-120%,500px) rotateZ(40deg) rotateX(60deg) scale(.001)}to{transform:none}}
@keyframes tb3-flip{from{transform:translate3d(0,-60%,250px) rotateX(-110deg) scale(.001)}to{transform:none}}
@keyframes tb3-sway{0%,100%{transform:none}35%{transform:rotateZ(3.5deg) rotateY(14deg)}70%{transform:rotateZ(-2deg) rotateY(-10deg)}}
@keyframes tb3-grind{0%,100%{transform:none}25%{transform:rotateZ(-7deg) translate3d(1%,1%,18px)}50%{transform:none}75%{transform:rotateZ(6deg) translate3d(-1%,1%,18px)}}
@keyframes tb3-wave{0%,100%{transform:none}50%{transform:translate3d(0,-3%,38px)}}
.tb3-floor{position:absolute;left:8%;right:8%;bottom:-16%;height:9%;border-radius:50%;  background:radial-gradient(closest-side,rgba(63,184,255,.55),transparent);
  animation:tb3-fade 1s 1.4s both,tb3-shadow 7s 2s ease-in-out infinite}
@keyframes tb3-fade{from{opacity:0}to{opacity:1}}
@keyframes tb3-shadow{0%,100%{transform:scaleX(.85)}50%{transform:scaleX(1.1)}}
/* ---- upgrade: rays, orbs, sparks, rings, shine, progress ---- */
.tb3-rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.6) 0 7deg,transparent 7deg 20deg);
  -webkit-mask:radial-gradient(closest-side,#000 8%,transparent 68%);mask:radial-gradient(closest-side,#000 8%,transparent 68%);
  opacity:0;animation:tb3-raysin 1.6s .5s both,tb3-rot 50s linear infinite}
@keyframes tb3-raysin{to{opacity:.75}}
@keyframes tb3-rot{to{transform:rotate(360deg)}}
/* orb sengaja ditahan di belakang logo (z negatif) supaya tidak menutupi badge */
.tb3-orbw{position:absolute;left:var(--x);top:var(--y);width:0;height:0;transform:translateZ(var(--z));transform-style:preserve-3d;pointer-events:none}
.tb3-orb{position:absolute;display:block;width:calc(var(--s)*1em);height:calc(var(--s)*1em);margin:calc(var(--s)*-.5em) 0 0 calc(var(--s)*-.5em);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.7) 12%,transparent 34%),radial-gradient(circle at 55% 60%,var(--oc),rgba(255,255,255,.2) 85%);
  box-shadow:inset -.8em -1em 1.8em rgba(255,255,255,.55),0 1.2em 3em rgba(63,184,255,.3);
  animation:tb3-orbin .9s cubic-bezier(.3,1.6,.5,1) var(--od) both,tb3-bobo var(--op) ease-in-out infinite}
@keyframes tb3-orbin{from{transform:scale(0)}to{transform:none}}
@keyframes tb3-bobo{0%,100%{transform:none}50%{transform:translateY(-16%)}}
.tb3-sp{position:absolute;left:50%;top:50%;display:block;width:calc(var(--sz)*1em);height:calc(var(--sz)*1em);margin:calc(var(--sz)*-.5em) 0 0 calc(var(--sz)*-.5em);
  border-radius:50%;background:var(--sc);box-shadow:0 0 1em var(--sc);opacity:0;animation:tb3-burst 1.3s cubic-bezier(.1,.7,.3,1) var(--sd) both}
@keyframes tb3-burst{0%{opacity:0;transform:none}10%{opacity:1}100%{opacity:0;transform:translate3d(var(--tx),var(--ty),var(--tz)) scale(.15)}}
.tb3-ringw{position:absolute;inset:0;transform:translateZ(1.5em);transform-style:preserve-3d;pointer-events:none}
.tb3-ring{position:absolute;display:block;left:20%;top:36%;width:14%;aspect-ratio:1;margin:-7% 0 0 -7%;border-radius:50%;
  border:.5em solid rgba(255,255,255,.95);box-shadow:0 0 2em var(--c3),inset 0 0 2em var(--c3);opacity:0;animation:tb3-ring 1.1s ease-out var(--rd) both}
@keyframes tb3-ring{0%{opacity:0;transform:scale(.1)}15%{opacity:1}100%{opacity:0;transform:scale(3.4)}}
.tb3-part b{position:absolute;inset:0;display:block;transform:translateZ(.12em);
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) no-repeat;background-size:300% 100%;background-position:100% 0;
  animation:tb3-shine 6s var(--sw) ease-in-out infinite}
@keyframes tb3-shine{0%{background-position:100% 0}30%,100%{background-position:0 0}}
.tb3-bar{position:absolute;left:50%;bottom:calc(8vh + env(safe-area-inset-bottom,0px));width:min(46vw,260px);height:6px;transform:translateX(-50%);
  border-radius:99px;overflow:hidden;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 2px rgba(63,184,255,.35),0 4px 14px rgba(63,184,255,.25)}
.tb3-bar i{display:block;height:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--c3),var(--c4));animation:tb3-fill 4.3s cubic-bezier(.4,0,.2,1) .15s both}
@keyframes tb3-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ---- mode adaptif: lite (HP / perangkat lemah) & ultra (otomatis kalau masih patah-patah) ---- */
.tb3-lite{--zs:.32em}
.tb3-lite .tb3-part i:not(:nth-child(1)):not(:nth-child(4)):not(:nth-child(8)):not(:nth-child(12)){display:none}
.tb3-lite .tb3-part b,.tb3-lite .tb3-rays{display:none}
.tb3-lite .tb3-orbw:nth-of-type(n+6),.tb3-lite .tb3-sp:nth-of-type(even){display:none}
.tb3-lite .tb3-tilt{transform:none!important}
.tb3-ultra .tb3-part i:not(:nth-child(12)){display:none}
.tb3-ultra .tb3-orbw,.tb3-ultra .tb3-sp,.tb3-ultra .tb3-floor{display:none}
.tb3-ultra .tb3-stage{animation:tb3-in 1.7s cubic-bezier(.2,.9,.3,1) both}
@media (prefers-reduced-motion:reduce){
  .tb3-splash *,.tb3-scene{animation:none!important}
  .tb3-splash{animation:tb3-out .5s ease 1.2s forwards}
}
    </style>

    <!-- SPLASH: tutup otomatis setelah animasi selesai, atau lewati dengan klik. -->
    <script>
    /* SPLASH 3D: hanya tampil sebelum login (belum ada sesi tersimpan).
       Sudah login -> splash disembunyikan seketika, halaman langsung siap.
       Klik = lewati, FPS rendah = mode lite/ultra. */
    (function(){
      var s=document.getElementById('tb3-splash');if(!s)return;
      var h=document.documentElement,sc=document.getElementById('tb3-scene'),t;
      // penanda sesi dari js/core/db.js (KS). Ada isinya = user sudah login.
      var sudah=false;
      try{sudah=!!localStorage.getItem('berkah_session')}catch(e){}
      if(sudah){s.remove();return}
      h.classList.add('tb3-lock');
      // deteksi perangkat: HP / RAM kecil / CPU sedikit langsung pakai mode lite
      var lv=((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4||innerWidth<700)?1:0;
      if(lv)s.classList.add('tb3-lite');
      // pantau FPS: kalau masih < 40fps, turunkan efek otomatis (lite -> ultra)
      var n=0,t0=0,tb=0;
      function chk(now){
        if(!tb)tb=t0=now;
        n++;
        if(now-t0>=600){
          if(n*1000/(now-t0)<40&&lv<2){lv++;s.classList.add(lv===1?'tb3-lite':'tb3-ultra')}
          n=0;t0=now;
        }
        if(now-tb<3400&&!s.classList.contains('tb3-done'))requestAnimationFrame(chk);
      }
      setTimeout(function(){requestAnimationFrame(chk)},500);
      function end(){clearTimeout(t);h.classList.remove('tb3-lock');s.classList.add('tb3-done')}
      t=setTimeout(end,5400);
      s.addEventListener('animationend',function(e){if(e.animationName==='tb3-out')end()});
      s.addEventListener('click',function(){s.classList.add('tb3-skip')}); // klik = lewati
      s.addEventListener('pointermove',function(e){
        sc.style.setProperty('--px',(e.clientX/innerWidth-.5)*2);
        sc.style.setProperty('--py',(e.clientY/innerHeight-.5)*2);
      });
    })();
    </script>
