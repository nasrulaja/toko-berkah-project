<!doctype html>
<!-- ==========================================================================
     TOKO BERKAH — SISTEM KASIR & STOK
     File   : index.html
     Fungsi : kerangka halaman. Semua isi (login / shell aplikasi) dibuat oleh
              js/app.js, jadi di sini hanya ada wadah kosong + pemuatan skrip.
     --------------------------------------------------------------------------
     PETA FILE — cari teks "BAGIAN n":
       BAGIAN 1  KEPALA DOKUMEN   meta, judul, font, urutan pemuatan CSS
       BAGIAN 2  BADAN DOKUMEN    wadah #app/#ov, skrip
     ========================================================================== -->
<html lang="id">
  <head>
    <!-- ====================================================================
         BAGIAN 1 — KEPALA DOKUMEN
         ==================================================================== -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Toko Berkah – Sistem Kasir & Stok</title>

    <!-- Font: Roboto untuk isi aplikasi, Nunito untuk halaman login -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Gaya: dasar dulu, lalu kaca (urutan ini penting, jangan diacak) -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/glass.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <!-- ====================================================================
         BAGIAN 2 — BADAN DOKUMEN
         ==================================================================== -->

    <!-- Wadah utama: login & shell aplikasi dirender ke sini oleh app.js -->
    <div id="app"></div>

    <!-- Wadah modal & overlay: diisi/dikosongkan oleh fungsi modal() di ui.js -->
    <div id="ov"></div>

    <!-- Skrip: app.js (modul ES) = logika aplikasi, glass-rail.js = rail kaca.
         app.js memakai type="module" karena mengimpor db.js, ui.js, pages.js. -->
    <script type="module" src="js/app.js"></script>
    <script src="js/glass-rail.js" defer></script>

  </body>
</html>
