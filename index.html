    <style>/* SPLASH: folder terbuka -> isinya keluar */
.tb-lock,.tb-lock body{overflow:hidden}
.tb-splash{
  --c0:#F9FDFF;--c1:#C3E9FE;--c2:#97D8FE;--c3:#67C8FF;--c4:#3FB8FF;
  position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(90% 70% at 50% 40%,var(--c0),var(--c1) 70%,var(--c2));
  clip-path:circle(150% at 50% 50%);animation:tb-out .9s cubic-bezier(.7,0,.3,1) 3.9s forwards;
}
.tb-splash.tb-skip{animation:tb-out .3s ease forwards}
.tb-splash.tb-done{display:none}
.tb-splash *,.tb-splash *::before,.tb-splash *::after{box-sizing:border-box}
@keyframes tb-out{to{clip-path:circle(0% at 50% 50%);visibility:hidden}}
.tb-blob{position:absolute;border-radius:50%}
.tb-blob.a{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(closest-side,var(--c3),transparent);opacity:.5;animation:tb-d1 14s ease-in-out infinite}
.tb-blob.b{width:46vmax;height:46vmax;right:-16vmax;top:12vh;background:radial-gradient(closest-side,var(--c2),transparent);opacity:.8;animation:tb-d2 16s ease-in-out infinite}
.tb-blob.c{width:44vmax;height:44vmax;left:20vw;bottom:-22vmax;background:radial-gradient(closest-side,var(--c4),transparent);opacity:.4;animation:tb-d1 15s ease-in-out infinite reverse}
@keyframes tb-d1{50%{transform:translate(14vmax,10vmax) scale(1.1)}}
@keyframes tb-d2{50%{transform:translate(-12vmax,12vmax) scale(.9)}}
.tb-rays{position:absolute;inset:-25%;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.85) 0deg 3deg,transparent 3deg 10deg);
  -webkit-mask:radial-gradient(closest-side,#000 22%,transparent 68%);mask:radial-gradient(closest-side,#000 22%,transparent 68%);
  opacity:0;animation:tb-raysin 1.6s .5s both,tb-rot 50s linear infinite}
@keyframes tb-raysin{to{opacity:.75}}
@keyframes tb-rot{to{transform:rotate(360deg)}}
/* panggung 3D tipis: folder terasa benar-benar terbuka */
.tb-scene{position:relative;width:min(84vw,560px);padding-bottom:34%;perspective:1200px;perspective-origin:50% 45%;--px:0;--py:0;
  animation:tb-zoom .9s cubic-bezier(.6,0,.9,.5) 3.9s forwards}
@keyframes tb-zoom{to{transform:scale(2.1)}}
.tb-tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(var(--px)*10deg)) rotateX(calc(var(--py)*-7deg));transition:transform .3s ease-out}
.tb-stage{position:absolute;inset:0;transform-style:preserve-3d;animation:tb-in 1.4s cubic-bezier(.2,.9,.3,1) both}
@keyframes tb-in{from{opacity:0;transform:translateY(34%) rotateX(52deg) scale(.72)}to{opacity:1;transform:none}}
.tb-floor{position:absolute;left:8%;right:8%;bottom:-6%;height:22%;border-radius:50%;transform:translateZ(-60px);
  background:radial-gradient(closest-side,rgba(63,184,255,.4),transparent 72%);animation:tb-in 1.4s both}
/* ---------- folder ---------- */
.tb-folder{position:absolute;left:18%;right:18%;top:20%;bottom:6%;transform-style:preserve-3d}
.tb-tab{position:absolute;left:3%;top:-9%;width:42%;height:20%;overflow:hidden;
  transform-origin:0 100%;animation:tb-tab 1s cubic-bezier(.2,1.3,.4,1) .35s both}
.tb-tab u{display:block;width:186%;height:290%;border-radius:14px 14px 0 0;
  background:linear-gradient(180deg,#7FD0FF,#4FBEFF);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.tb-back{position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(180deg,#8BD5FF,#5CC2FF);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 14px rgba(10,59,92,.12);
  animation:tb-grow .8s cubic-bezier(.2,1.1,.4,1) .1s both}
/* tutup depan: berputar ke belakang = folder TERBUKA */
.tb-front{position:absolute;left:-1.5%;right:-1.5%;top:4%;bottom:-9%;transform-origin:50% 100%;transform-style:preserve-3d;
  animation:tb-open 1.25s cubic-bezier(.22,1.05,.36,1) 1s both,tb-sway 5.5s 2.4s ease-in-out infinite}
.tb-front>span{position:absolute;inset:0;display:block;overflow:hidden;border-radius:6px 6px 12px 12px;
  background:linear-gradient(180deg,#EAF8FF 0%,#BFE7FF 46%,#8ED5FF 100%);
  box-shadow:inset 0 2px 0 #fff,inset 0 -8px 16px rgba(10,59,92,.14),0 14px 30px rgba(63,184,255,.35)}
.tb-front>span:before{content:"";position:absolute;left:7%;top:13%;width:86%;height:10%;border-radius:99px;
  background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.25))}
.tb-front>span:after{content:"";position:absolute;left:7%;top:31%;width:48%;height:7%;border-radius:99px;background:rgba(255,255,255,.62)}
/* kartu-kartu (isi folder) */
.tb-item{position:absolute;width:26%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;
  box-shadow:0 10px 22px rgba(10,59,92,.18),inset 0 0 0 1px rgba(255,255,255,.9);
  background:linear-gradient(165deg,#fff,#D9F1FF 70%,#BEE7FF)}
.tb-item:before{content:"";position:absolute;left:16%;right:16%;top:20%;height:7%;border-radius:99px;background:#9FD9FE}
.tb-item:after{content:"";position:absolute;left:16%;right:38%;top:36%;height:6%;border-radius:99px;background:#CBE9FE;
  box-shadow:0 1.1em 0 -.05em #CBE9FE,0 2.2em 0 -.05em #CBE9FE}
.tb-item em{position:absolute;right:20%;bottom:15%;width:30%;aspect-ratio:1;border-radius:9px;
  background:linear-gradient(150deg,#67C8FF,#3FB8FF);box-shadow:0 4px 10px rgba(63,184,255,.5)}
.tb-item.i1{left:10%;bottom:26%;--r:-11deg;animation:tb-pop 1.1s cubic-bezier(.2,1.4,.4,1) 1.05s both,tb-float 4.2s 2.2s ease-in-out infinite}
.tb-item.i2{left:34%;bottom:30%;--r:3deg;animation:tb-pop 1.1s cubic-bezier(.2,1.4,.4,1) 1.18s both,tb-float 4.6s 2.4s ease-in-out infinite}
.tb-item.i3{left:58%;bottom:25%;--r:14deg;animation:tb-pop 1.1s cubic-bezier(.2,1.4,.4,1) 1.31s both,tb-float 4.4s 2.6s ease-in-out infinite}
.tb-item.i4{left:22%;bottom:31%;--r:-6deg;animation:tb-pop 1.1s cubic-bezier(.2,1.4,.4,1) 1.6s both,tb-float 4.8s 2.8s ease-in-out infinite}
.tb-item.i5{left:46%;bottom:28%;--r:9deg;animation:tb-pop 1.1s cubic-bezier(.2,1.4,.4,1) 1.73s both,tb-float 4.3s 3s ease-in-out infinite}
@keyframes tb-grow{from{opacity:0;transform:scale(.4,.2)}to{opacity:1;transform:none}}
@keyframes tb-tab{from{opacity:0;transform:rotateX(-90deg) scaleY(.2)}to{opacity:1;transform:none}}
@keyframes tb-open{from{transform:rotateX(0deg)}to{transform:rotateX(74deg)}}
@keyframes tb-sway{0%,100%{transform:rotateX(74deg)}50%{transform:rotateX(70deg) rotateZ(-1.2deg)}}
@keyframes tb-pop{from{opacity:0;transform:translate3d(0,40%,-40px) rotate(var(--r)) scale(.5)}
  to{opacity:1;transform:translate3d(0,-28%,0) rotate(var(--r)) scale(1)}}
@keyframes tb-float{0%,100%{transform:translate3d(0,-28%,0) rotate(var(--r))}
  50%{transform:translate3d(0,-42%,14px) rotate(calc(var(--r) * -1))}}
.tb-bar{position:absolute;left:50%;bottom:calc(8vh + env(safe-area-inset-bottom,0px));width:min(46vw,260px);height:6px;transform:translateX(-50%);
  border-radius:99px;overflow:hidden;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 2px rgba(63,184,255,.35),0 4px 14px rgba(63,184,255,.25)}
.tb-bar i{display:block;height:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--c3),var(--c4));animation:tb-fill 3.9s cubic-bezier(.4,0,.2,1) .15s both}
@keyframes tb-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ---- mode adaptif: lite (HP / perangkat lemah) & ultra (otomatis kalau masih patah-patah) ---- */
.tb-splash.tb-lite .tb-rays,.tb-splash.tb-lite .tb-front>span:after,.tb-splash.tb-lite .tb-item:after,.tb-splash.tb-lite .tb-floor{display:none}
.tb-splash.tb-lite .tb-tilt{transform:none!important}
.tb-splash.tb-ultra .tb-rays,.tb-splash.tb-ultra .tb-floor,.tb-splash.tb-ultra .tb-item{display:none}
.tb-splash.tb-ultra .tb-front{animation:tb-open 1.25s cubic-bezier(.22,1.05,.36,1) 1s both}
@media (prefers-reduced-motion:reduce){
  .tb-splash *,.tb-scene{animation:none!important}
  .tb-splash{animation:tb-out .5s ease 1.2s forwards}
}
    </style>
  </head>

  <body>
    <!-- ====================================================================
         BAGIAN 2 â€” BADAN DOKUMEN
         ==================================================================== -->

    <!-- SPLASH: folder terbuka, lalu isinya keluar. Muncul setiap halaman dimuat.
         Murni CSS (tanpa gambar), jadi tidak ada aset yang bisa gagal dimuat. -->
    <div class="tb-splash" id="tb-splash" role="img" aria-label="Toko Berkah, folder dibuka, memuat">
      <div class="tb-rays"></div><div class="tb-blob a"></div><div class="tb-blob b"></div><div class="tb-blob c"></div>
      <div class="tb-scene" id="tb-scene">
        <div class="tb-tilt"><div class="tb-stage">
          <div class="tb-folder">
            <div class="tb-tab"><u></u></div>
            <div class="tb-back"></div>
            <div class="tb-item i1"><em></em></div>
            <div class="tb-item i2"><em></em></div>
            <div class="tb-item i3"><em></em></div>
            <div class="tb-item i4"><em></em></div>
            <div class="tb-item i5"><em></em></div>
            <div class="tb-front"><span></span></div>
          </div>
          <div class="tb-floor"></div>
        </div></div>
      </div>
      <div class="tb-bar"><i></i></div>
    </div>
    </div>

    <!-- Wadah utama: login & shell aplikasi dirender ke sini oleh app.js -->
    <div id="app"></div>

    <!-- Wadah modal & overlay: diisi/dikosongkan oleh fungsi modal() di ui.js -->
    <div id="ov"></div>

    <!-- Skrip: app.js (modul ES) = logika aplikasi, glass-rail.js = rail kaca.
         app.js memakai type="module" karena mengimpor db.js, ui.js, pages.js. -->
    <script type="module" src="js/app.js?v=20261117q"></script>
    <script src="js/glass-rail.js?v=20261117q" defer></script>

    <!-- SPLASH: tutup otomatis setelah animasi selesai, atau lewati dengan klik. -->
    <script>
      (function () {
        var s = document.getElementById('tb-splash');
        if (!s) return;
        var h = document.documentElement,
          sc = document.getElementById('tb-scene'),
          t;
        h.classList.add('tb-lock');
        // deteksi perangkat: HP / RAM kecil / CPU sedikit langsung pakai mode lite
        var lv = ((navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4 || innerWidth < 700) ? 1 : 0;
        if (lv) s.classList.add('tb-lite');
        // pantau FPS: kalau masih < 40fps, turunkan efek otomatis (lite -> ultra)
        var n = 0, t0 = 0, tb = 0;
        function chk(now) {
          if (!tb) tb = t0 = now;
          n++;
          if (now - t0 >= 600) {
            if (n * 1000 / (now - t0) < 40 && lv < 2) {
              lv++;
              s.classList.add(lv === 1 ? 'tb-lite' : 'tb-ultra');
            }
            n = 0;
            t0 = now;
          }
          if (now - tb < 3100 && !s.classList.contains('tb-done')) requestAnimationFrame(chk);
        }
        setTimeout(function () { requestAnimationFrame(chk); }, 500);
        function end() {
          clearTimeout(t);
          h.classList.remove('tb-lock');
          s.classList.add('tb-done');
        }
        t = setTimeout(end, 4600);
        s.addEventListener('animationend', function (e) {
          if (e.animationName === 'tb-out') end();
        });
        s.addEventListener('click', function () {
          s.classList.add('tb-skip');
        }); // klik = lewati
        s.addEventListener('pointermove', function (e) {
          sc.style.setProperty('--px', (e.clientX / innerWidth - .5) * 2);
          sc.style.setProperty('--py', (e.clientY / innerHeight - .5) * 2);
        });
      })();
    </script>
  </body>
