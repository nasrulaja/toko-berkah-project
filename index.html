<!doctype html>
<!-- ==========================================================================
     TOKO BERKAH — SISTEM STOK & TRANSAKSI
     File   : index.html
     Fungsi : kerangka halaman. Semua isi (login / shell aplikasi) dibuat oleh
              js/app.js, jadi di sini hanya ada wadah kosong + pemuatan skrip.
     --------------------------------------------------------------------------
     PETA FILE — cari teks "BAGIAN n":
       BAGIAN 1  KEPALA DOKUMEN   meta, judul, font, urutan pemuatan CSS
       BAGIAN 2  BADAN DOKUMEN    wadah #app/#ov, skrip
     ========================================================================== -->
<html lang="id" data-theme="light">
  <head>
    <!-- ====================================================================
         BAGIAN 1 — KEPALA DOKUMEN
         ==================================================================== -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Toko Berkah – Sistem Manajemen Toko</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/ikon-192.png" />

    <!-- Tema awal: TERANG. Atribut data-theme="light" di <html> mencegah kilatan gelap
         untuk pengunjung ber-OS mode gelap; pilihan tema yang pernah disimpan dipulihkan
         di sini, sebelum halaman digambar. -->
    

    <!-- Font: Roboto untuk isi aplikasi, Nunito untuk halaman login -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Gaya: dasar dulu, lalu kaca (urutan ini penting, jangan diacak) -->
    <link rel="stylesheet" href="css/style.css?v=20261117q" />
    <link rel="stylesheet" href="css/glass.css?v=20261117q" />
    <link rel="stylesheet" href="css/pages/dashboard.css?v=20261117q" />
    <link rel="stylesheet" href="css/mobile.css?v=20261117q" />
    <link rel="stylesheet" href="css/light.css?v=20261117q" />
    <link rel="stylesheet" href="css/loader.css?v=20261117q" />

    <!-- Gaya splash (dulu di css/splash.css, kini menyatu di sini).
         Dipisah agar cepat terbaca browser sebelum halaman digambar. -->
    <style>/* SPLASH */
@property --tb-a{syntax:"<angle>";inherits:false;initial-value:0deg}
.tb-lock,.tb-lock body{overflow:hidden}
.tb-splash{
  --c0:#F9FDFF;--c1:#C3E9FE;--c2:#97D8FE;--c3:#67C8FF;--c4:#3FB8FF;
  position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,var(--c0) 10%,var(--c1) 65%,var(--c2));
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;
  animation:tb-out .8s cubic-bezier(.6,0,.3,1) 3.8s forwards;
}
.tb-splash.tb-skip{animation:tb-out .3s ease forwards}
.tb-splash.tb-done{display:none}
.tb-splash *,.tb-splash *::before,.tb-splash *::after{box-sizing:border-box}
@keyframes tb-out{to{opacity:0;transform:scale(1.08);visibility:hidden}}
.tb-blob{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
.tb-blob.a{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:var(--c3);opacity:.55;animation:tb-d1 14s ease-in-out infinite}
.tb-blob.b{width:48vmax;height:48vmax;right:-16vmax;top:10vh;background:var(--c2);opacity:.8;animation:tb-d2 16s ease-in-out infinite}
.tb-blob.c{width:46vmax;height:46vmax;left:18vw;bottom:-22vmax;background:var(--c4);opacity:.45;animation:tb-d3 15s ease-in-out infinite}
@keyframes tb-d1{50%{transform:translate(14vmax,10vmax) scale(1.1)}}
@keyframes tb-d2{50%{transform:translate(-12vmax,12vmax) scale(.9)}}
@keyframes tb-d3{50%{transform:translate(10vmax,-10vmax) scale(1.12)}}
.tb-card{
  position:relative;isolation:isolate;width:min(92vw,720px);
  padding:clamp(26px,6vw,60px) clamp(20px,5vw,54px);border-radius:clamp(28px,5vw,52px);
  background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.85),transparent 55%),linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.3));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1.5px 0 #fff,inset 0 -1.5px 0 rgba(255,255,255,.4),0 24px 60px rgba(63,184,255,.38);
  animation:tb-card .9s cubic-bezier(.2,1.2,.4,1) both;
}
.tb-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--tb-a),#fff,rgba(255,255,255,.2) 22%,var(--c3) 48%,rgba(255,255,255,.2) 72%,#fff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;animation:tb-spin 8s linear infinite;
}
@keyframes tb-spin{to{--tb-a:360deg}}
@keyframes tb-card{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.tb-logo{position:relative;width:100%;aspect-ratio:2064/762;filter:drop-shadow(0 8px 14px rgba(63,184,255,.45))}
.tb-p{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
.tb-pestle{transform-origin:9% 92%}
.tb-leaf{transform-origin:92% 100%}
.tb-basket{transform-origin:50% 100%}
.tb-basket{animation:tb-rise .9s cubic-bezier(.2,1.2,.4,1) var(--d) both,tb-breathe 4.5s 2.6s ease-in-out infinite}
.tb-leaf{animation:tb-grow .9s cubic-bezier(.25,1.4,.45,1) var(--d) both,tb-sway 4s 2.6s ease-in-out infinite}
.tb-pestle{animation:tb-drop 1s cubic-bezier(.3,1.35,.5,1) var(--d) both,tb-grind 3.2s 2.6s ease-in-out infinite}
.tb-l{animation:tb-pop .7s cubic-bezier(.3,1.7,.5,1) var(--d) both,tb-bob 3.4s calc(2.4s + var(--d)) ease-in-out infinite}
@keyframes tb-rise{from{opacity:0;transform:translateY(35%) scale(.88)}to{opacity:1;transform:none}}
@keyframes tb-grow{from{opacity:0;transform:scale(0) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes tb-drop{from{opacity:0;transform:translate(12%,-70%) rotate(28deg)}to{opacity:1;transform:none}}
@keyframes tb-pop{from{opacity:0;transform:translateY(-80%) scale(.4)}to{opacity:1;transform:none}}
@keyframes tb-breathe{50%{transform:scale(1.012)}}
@keyframes tb-sway{0%,100%{transform:rotate(0)}35%{transform:rotate(3.5deg)}70%{transform:rotate(-2deg)}}
@keyframes tb-grind{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translate(1%,1%)}50%{transform:rotate(0)}75%{transform:rotate(6deg) translate(-1%,1%)}}
@keyframes tb-bob{0%,100%{transform:none}50%{transform:translateY(-4%)}}
@media (prefers-reduced-motion:reduce){
  .tb-splash *{animation:none!important}
  .tb-splash{animation:tb-out .5s ease 1.2s forwards}
}
</style>
  </head>

  <body>
    <!-- ====================================================================
         BAGIAN 2 — BADAN DOKUMEN
         ==================================================================== -->

    <!-- SPLASH: tampil setiap halaman dimuat / di-reload. Isi kartu = potongan
         logo (PNG terpisah di assets/splash/) yang dianimasikan satu per satu. -->
    <div class="tb-splash" id="tb-splash" role="img" aria-label="Toko Berkah, memuat">
      <div class="tb-blob a"></div><div class="tb-blob b"></div><div class="tb-blob c"></div>
      <div class="tb-card"><div class="tb-logo">
        <img class="tb-p tb-basket" style="left:0.775%;top:28.215%;width:43.508%;height:60.761%;--d:0.05s" src="assets/splash/basket.png" alt="" draggable="false">
        <img class="tb-p tb-leaf" style="left:0.242%;top:50.787%;width:23.014%;height:48.294%;--d:0.45s" src="assets/splash/leaf.png" alt="" draggable="false">
        <img class="tb-p tb-pestle" style="left:19.864%;top:0.525%;width:14.341%;height:37.139%;--d:0.8s" src="assets/splash/pestle.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:45.688%;top:16.929%;width:11.337%;height:31.759%;--d:1.1s" src="assets/splash/T.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:54.748%;top:23.491%;width:11.047%;height:25.459%;--d:1.17s" src="assets/splash/o1.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:66.473%;top:16.404%;width:9.981%;height:32.283%;--d:1.24s" src="assets/splash/k1.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:75.872%;top:23.622%;width:10.998%;height:25.328%;--d:1.31s" src="assets/splash/o2.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:45.397%;top:51.837%;width:10.562%;height:31.102%;--d:1.38s" src="assets/splash/B.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:56.202%;top:58.661%;width:9.545%;height:24.672%;--d:1.45s" src="assets/splash/e.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:66.231%;top:59.186%;width:5.717%;height:23.885%;--d:1.52s" src="assets/splash/r.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:72.141%;top:51.444%;width:9.351%;height:31.496%;--d:1.59s" src="assets/splash/k2.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:81.105%;top:58.793%;width:8.818%;height:24.541%;--d:1.66s" src="assets/splash/a.png" alt="" draggable="false">
        <img class="tb-p tb-l" style="left:90.649%;top:51.444%;width:9.205%;height:31.365%;--d:1.73s" src="assets/splash/h.png" alt="" draggable="false">
      </div></div>
    </div>

    <!-- Wadah utama: login & shell aplikasi dirender ke sini oleh app.js -->
    <div id="app"></div>

    <!-- Wadah modal & overlay: diisi/dikosongkan oleh fungsi modal() di ui.js -->
    <div id="ov"></div>

    <!-- Skrip: app.js (modul ES) = logika aplikasi, glass-rail.js = rail kaca.
         app.js memakai type="module" karena mengimpor db.js, ui.js, pages.js. -->
    <script type="module" src="js/app.js?v=20261117q"></script>
    <script src="js/glass-rail.js?v=20261117q" defer></script>

    <!-- SPLASH: tutup otomatis setelah animasi selesai, atau lewati dengan klik. -->
    <script>
      (function () {
        var s = document.getElementById('tb-splash');
        if (!s) return;
        var h = document.documentElement,
          t;
        h.classList.add('tb-lock');
        function end() {
          clearTimeout(t);
          h.classList.remove('tb-lock');
          s.classList.add('tb-done');
        }
        t = setTimeout(end, 4800);
        s.addEventListener('animationend', function (e) {
          if (e.animationName === 'tb-out') end();
        });
        s.addEventListener('click', function () {
          s.classList.add('tb-skip');
        }); // klik = lewati
      })();
    </script>
  </body>
</html>
